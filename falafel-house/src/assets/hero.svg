  <ellipse cx="500" cy="590" rx="470" ry="26" fill="url(#shadow)"/>
  <!-- tray -->
  <path d="M70,372 L930,318 Q978,316 982,358 L994,528 Q996,566 952,568 L74,600 Q28,602 26,560 L22,418 Q22,376 70,372 Z" fill="url(#tray)"/>
  <path d="M92,394 L910,342 Q948,341 950,372 L960,520 Q961,546 930,548 L96,578 Q60,580 58,550 L54,428 Q54,397 92,394 Z" fill="url(#trayIn)"/>
  <path d="M70,372 L930,318 Q978,316 982,358" stroke="#F4F6F8" stroke-width="5" fill="none" opacity="0.8"/>
  <!-- paper liner -->
  <path d="M150,300 L700,236 L880,300 L900,520 L640,560 L190,566 L100,470 Z" fill="#F8F2E4"/>
  <path d="M150,300 L700,236 L880,300 L900,520 L640,560 L190,566 L100,470 Z" fill="none" stroke="#E2D6BC" stroke-width="2"/>
  <path d="M300,290 L420,560 M640,250 L560,556 M760,280 L840,520" stroke="#E9DEC6" stroke-width="2" fill="none"/>
  <g fill="#42BD41" font-family="Arial Rounded MT Bold, Nunito, Helvetica, Arial, sans-serif" font-weight="900" font-size="30" opacity="0.9">
    <text x="150" y="350" transform="rotate(-7 150 350)">falafel house</text>
    <text x="120" y="450" transform="rotate(-7 120 450)">falafel house</text>
    <text x="210" y="540" transform="rotate(-7 210 540)">falafel house</text>
    <text x="640" y="300" transform="rotate(-7 640 300)">falafel house</text>
    <text x="680" y="400" transform="rotate(-7 680 400)">falafel house</text>
    <text x="640" y="510" transform="rotate(-7 640 510)">falafel house</text>
  </g>
  <!-- back falafels -->
  <use xlink:href="#falafel" transform="translate(190 400) scale(1.1)"/>
  <use xlink:href="#falafel" transform="translate(860 360) scale(1.1)"/>
  <!-- wrap halves -->
  <ellipse cx="510" cy="500" rx="300" ry="44" fill="url(#shadow)"/>
  <use xlink:href="#half" transform="translate(395 150) rotate(-10) scale(1.45)"/>
  <use xlink:href="#half" transform="translate(625 178) rotate(9) scale(1.45)"/>
  <!-- parsley -->
  <g fill="#3E9A2E">
    <path d="M300,470 q-20,-30 6,-46 q8,22 -6,46 Z"/><path d="M304,468 q4,-36 34,-38 q-6,26 -34,38 Z"/><path d="M302,470 q30,-14 46,6 q-24,10 -46,-6 Z"/>
    <path d="M690,500 q-22,-26 2,-46 q12,20 -2,46 Z"/><path d="M694,498 q8,-34 38,-32 q-10,24 -38,32 Z"/>
  </g>
  <!-- front falafels -->
  <use xlink:href="#falafel" transform="translate(270 500) scale(1.25)"/>
  <use xlink:href="#falafel" transform="translate(380 540) scale(1.3)"/>
  <g transform="translate(560 545) scale(1.25)">
    <ellipse cx="4" cy="42" rx="50" ry="12" fill="url(#shadow)"/>
    <circle r="46" fill="url(#ball)"/>
    <ellipse cx="-2" cy="-4" rx="36" ry="30" fill="url(#ballIn)"/>
    <g fill="#3F6E1C"><circle cx="-12" cy="-8" r="3"/><circle cx="8" cy="4" r="2.5"/><circle cx="12" cy="-14" r="2"/><circle cx="-6" cy="12" r="2.5"/></g>
    <g fill="#C6E08A"><circle cx="-4" cy="-14" r="2"/><circle cx="16" cy="8" r="1.8"/></g>
  </g>
  <use xlink:href="#falafel" transform="translate(720 520) scale(1.2)"/>
  <!-- hummus ramekin -->
  <g transform="translate(860 470) scale(1.1)">
    <ellipse cx="0" cy="58" rx="80" ry="16" fill="url(#shadow)"/>
    <path d="M-72,0 L-60,48 Q0,70 60,48 L72,0 Z" fill="#FFFFFF"/>
    <path d="M-72,0 L-60,48 Q0,70 60,48 L72,0 Z" fill="#E7E2D8" opacity="0.5"/>
    <ellipse rx="72" ry="22" fill="#FFFFFF"/>
    <ellipse rx="62" ry="17" fill="#EED9A8"/>
    <path d="M-40,0 Q-10,-14 20,-2 Q40,8 10,8 Q-20,8 -40,0 Z" fill="#D8B24A" opacity="0.8"/>
    <g fill="#C8442A"><circle cx="-20" cy="-4" r="2.4"/><circle cx="6" cy="2" r="2"/><circle cx="24" cy="-6" r="2.2"/><circle cx="-34" cy="4" r="1.8"/></g>
    <circle cx="-4" cy="-6" r="4" fill="#3B3B1E"/>
  </g>
</svg>
