<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 -20 1000 640">
  <defs>
    <linearGradient id="tray" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E4E7EA"/>
      <stop offset="0.55" stop-color="#B9BEC3"/>
      <stop offset="1" stop-color="#8E949A"/>
    </linearGradient>
    <linearGradient id="trayIn" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#D3D7DB"/>
      <stop offset="1" stop-color="#A8AEB4"/>
    </linearGradient>
    <radialGradient id="ball" cx="0.38" cy="0.32" r="0.75">
      <stop offset="0" stop-color="#D9913F"/>
      <stop offset="0.45" stop-color="#A9601F"/>
      <stop offset="1" stop-color="#5E2E0D"/>
    </radialGradient>
    <radialGradient id="ballIn" cx="0.5" cy="0.45" r="0.6">
      <stop offset="0" stop-color="#9CCB4E"/>
      <stop offset="1" stop-color="#5E8F2A"/>
    </radialGradient>
    <linearGradient id="tort" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C98F45"/>
      <stop offset="0.35" stop-color="#EDCB8C"/>
      <stop offset="0.7" stop-color="#E3B56E"/>
      <stop offset="1" stop-color="#B57A33"/>
    </linearGradient>
    <radialGradient id="shadow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#000" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="faceA"><ellipse cx="0" cy="0" rx="84" ry="50"/></clipPath>
    <g id="falafel">
      <ellipse cx="4" cy="40" rx="46" ry="12" fill="url(#shadow)"/>
      <circle r="44" fill="url(#ball)"/>
      <g fill="#4A230A" opacity="0.55">
        <circle cx="-18" cy="10" r="3"/><circle cx="12" cy="20" r="2.5"/><circle cx="22" cy="-6" r="2"/>
        <circle cx="-6" cy="28" r="2.5"/><circle cx="28" cy="14" r="3"/><circle cx="-28" cy="-8" r="2"/>
        <circle cx="4" cy="4" r="2"/><circle cx="-14" cy="-24" r="1.8"/>
      </g>
      <g fill="#F2B866" opacity="0.7">
        <circle cx="-16" cy="-20" r="3"/><circle cx="-4" cy="-28" r="2"/><circle cx="-24" cy="-4" r="1.8"/>
        <circle cx="6" cy="-16" r="1.6"/>
