    </g>
    <g id="face">
      <ellipse rx="96" ry="60" fill="#E2B877"/>
      <ellipse rx="96" ry="60" fill="none" stroke="#B57A33" stroke-width="3"/>
      <ellipse rx="84" ry="50" fill="#F4E9D0"/>
      <g clip-path="url(#faceA)">
        <path d="M-90,-10 Q-70,-40 -45,-22 Q-30,-48 -6,-28 Q10,-52 30,-30 Q48,-50 64,-26 Q84,-40 92,-12 L92,-60 L-90,-60 Z" fill="#5FB63F"/>
        <path d="M-90,8 Q-72,-14 -54,0 Q-40,-20 -20,-4 L-30,20 Q-60,30 -90,26 Z" fill="#7DCB52"/>
        <circle cx="-48" cy="12" r="20" fill="#8A4A1B"/>
        <circle cx="-48" cy="12" r="14" fill="#7FAE3E"/>
        <circle cx="14" cy="4" r="24" fill="#93511E"/>
        <circle cx="14" cy="4" r="17" fill="#8DBB48"/>
        <circle cx="10" cy="0" r="4" fill="#6C9631"/>
        <path d="M44,-6 a20,20 0 1,1 0,34 a12,12 0 1,0 0,-34 Z" fill="#E2412F"/>
        <circle cx="58" cy="12" r="17" fill="#E2412F"/>
        <circle cx="58" cy="12" r="11" fill="#F27561"/>
        <g fill="#FCE3A6"><circle cx="54" cy="8" r="2"/><circle cx="62" cy="15" r="2"/><circle cx="60" cy="6" r="1.6"/></g>
        <path d="M-30,30 q10,-12 22,0 q10,12 22,0 q12,-12 24,0" stroke="#B4307A" stroke-width="6" fill="none" stroke-linecap="round"/>
        <path d="M-80,40 Q-40,10 0,36 Q40,58 86,30" stroke="#FFFFFF" stroke-width="7" fill="none" stroke-linecap="round" opacity="0.92"/>
        <path d="M-70,-22 Q-20,-2 30,-20 Q60,-30 80,-14" stroke="#FFF8EA" stroke-width="5" fill="none" stroke-linecap="round" opacity="0.9"/>
        <path d="M-60,46 L-40,40 M-10,48 L10,44" stroke="#E1452E" stroke-width="5" stroke-linecap="round"/>
      </g>
    </g>
    <g id="half">
      <path d="M-98,0 L-82,214 Q0,262 82,214 L98,0 Z" fill="url(#tort)"/>
      <g stroke="#9A5E22" stroke-width="7" stroke-linecap="round" opacity="0.5">
        <path d="M-80,60 L-30,40"/><path d="M-82,120 L10,84"/><path d="M-70,180 L60,128"/><path d="M-20,226 L80,186"/>
      </g>
      <g fill="#8A4F17" opacity="0.35">
