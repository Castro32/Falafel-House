<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <radialGradient id="shadow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#000" stop-opacity="0.3"/><stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="juice" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5E9E22"/><stop offset="0.4" stop-color="#A6D84A"/><stop offset="1" stop-color="#4E8A1B"/>
    </linearGradient>
    <linearGradient id="cup" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.15"/><stop offset="0.3" stop-color="#FFFFFF" stop-opacity="0.55"/><stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.05"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0.2"/>
    </linearGradient>
  </defs>
  <ellipse cx="200" cy="370" rx="80" ry="12" fill="url(#shadow)"/>
  <!-- straw -->
  <g transform="rotate(14 230 70)">
    <rect x="222" y="10" width="16" height="190" rx="6" fill="#FFFFFF"/>
    <path d="M222,24 L238,14 M222,48 L238,38 M222,72 L238,62 M222,96 L238,86 M222,120 L238,110" stroke="#42BD41" stroke-width="9"/>
  </g>
  <!-- dome lid -->
  <path d="M120,124 Q120,70 200,66 Q280,70 280,124 Z" fill="#FFFFFF" opacity="0.65"/>
  <path d="M120,124 Q120,70 200,66 Q280,70 280,124" fill="none" stroke="#FFFFFF" stroke-width="3"/>
  <rect x="112" y="118" width="176" height="14" rx="7" fill="#F1F1EE"/>
  <!-- cup -->
  <path d="M122,132 L142,356 Q200,368 258,356 L278,132 Z" fill="url(#juice)"/>
  <g fill="#D9F09A" opacity="0.6"><circle cx="170" cy="170" r="4"/><circle cx="214" cy="200" r="3"/><circle cx="186" cy="260" r="3.5"/><circle cx="230" cy="290" r="3"/><circle cx="160" cy="320" r="3"/></g>
  <!-- label -->
  <path d="M132,216 L268,216 L262,296 L138,296 Z" fill="#F7F1E3"/>
  <text x="200" y="262" text-anchor="middle" font-family="Arial Rounded MT Bold, Nunito, Helvetica, Arial, sans-serif" font-weight="900" font-size="46" fill="#42BD41">fh</text>
  <text x="200" y="285" text-anchor="middle" font-family="Arial Black, Helvetica, Arial, sans-serif" font-weight="900" font-size="12" letter-spacing="2" fill="#141414">COLD-PRESSED</text>
  <path d="M122,132 L142,356 Q200,368 258,356 L278,132 Z" fill="url(#cup)"/>
  <!-- leaves -->
  <path d="M262,214 q30,-30 60,-10 q-30,26 -60,10 Z" fill="#3E9A2E"/>
  <path d="M262,214 q40,-6 58,-10" stroke="#2A6E1F" stroke-width="2" fill="none"/>
